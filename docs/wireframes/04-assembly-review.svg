<text x="898" y="845" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#303740">Refer to another agency</text>
<text x="58" y="950" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#303740">Every update records its author, date and previous status. Residents can provide follow-up evidence.</text>
<text x="58" y="979" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#303740">Priority choices: High / Normal / Low, following criteria agreed with the participating assembly.</text>
<path d="M36,995 L1204,995" fill="none" stroke="#c6cbd0" stroke-width="1"/>
<text x="36" y="1025" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#303740">Routing assigns a queue first. “Sent”, “acknowledged” and “resolved” require evidence of the corresponding action.</text>
