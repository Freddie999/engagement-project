<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1130" viewBox="0 0 960 1130" role="img" aria-labelledby="title desc"><title id="title">03 / Review, submit and follow progress</title><desc id="desc">Resident workflow • Updates distinguish community observations from assembly actions.</desc><rect width="100%" height="100%" fill="#f5f6f7"/>
<text x="36" y="45" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#303740">03 / Review, submit and follow progress</text>
<text x="36" y="76" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#303740">Resident workflow • Updates distinguish community observations from assembly actions.</text>
<rect x="36" y="112" width="426" height="866" rx="22" fill="#fff" stroke="#737b84"/>
<text x="58" y="142" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#303740">ASSEMBLY CONNECT</text>
<text x="58" y="177" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#303740">Review your report</text>
<text x="58" y="205" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#303740">Check the details before submitting</text>
<path d="M54,223 L444,223" fill="none" stroke="#c6cbd0" stroke-width="1"/>
<rect x="58" y="249" width="382" height="106" rx="4" fill="#eceff1" stroke="#a8adb3"/>
<path d="M70,261 L428,343" fill="none" stroke="#c6cbd0" stroke-width="1"/>
<path d="M428,261 L70,343" fill="none" stroke="#c6cbd0" stroke-width="1"/>
<rect x="70" y="287" width="358" height="30" rx="0" fill="#eceff1" stroke="#eceff1"/>
<text x="80" y="308" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#303740">Selected photo (optional)</text>
<text x="58" y="390" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#303740">Blocked drain near market</text>
<text x="58" y="424" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#303740">Category: Blocked drain</text>
<text x="58" y="454" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#303740">Location: Market entrance</text>
<text x="58" y="484" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#303740">Observed: Selected date / time</text>
<text x="58" y="514" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#303740">Impact: Water on the footpath</text>
<text x="58" y="563" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#303740">Possible receiving team</text>
<text x="58" y="588" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#303740">Environmental health · Selected assembly</text>
<rect x="58" y="614" width="382" height="89" rx="8" fill="#f3f5f6" stroke="#a8adb3"/>
<text x="72" y="641" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#303740">Prototype: saved to a demonstration queue.</text>
<text x="72" y="664" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#303740">This does not send a report to an assembly.</text>
<text x="72" y="687" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#303740">Agency assignment must be confirmed.</text>
<text x="58" y="738" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#303740">Your photo, location and report will be public.</text>
<text x="58" y="765" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#303740">Your contact details will remain private.</text>
<text x="58" y="811" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#303740">□ Follow this report (sign in / subscribe)</text>
<rect x="58" y="844" width="382" height="42" rx="5" fill="#303740" stroke="#737b84"/>
<text x="72" y="871" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#fff">Submit report</text>
<rect x="58" y="902" width="382" height="42" rx="5" fill="#fff" stroke="#737b84"/>
<text x="72" y="929" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#303740">Edit details</text>
<rect x="498" y="112" width="426" height="866" rx="22" fill="#fff" stroke="#737b84"/>
<text x="520" y="142" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#303740">ASSEMBLY CONNECT</text>
<text x="520" y="177" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#303740">Report saved · #014</text>
<text x="520" y="205" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#303740">Submitted • Awaiting review</text>
<path d="M516,223 L906,223" fill="none" stroke="#c6cbd0" stroke-width="1"/>
<rect x="520" y="249" width="382" height="74" rx="8" fill="#f3f5f6" stroke="#a8adb3"/>
<text x="534" y="278" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#303740">Your report is now on the community map.</text>
<text x="534" y="302" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#303740">Submission does not mean agency receipt.</text>
<rect x="520" y="341" width="382" height="42" rx="5" fill="#303740" stroke="#737b84"/>
<text x="534" y="368" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#fff">View report on map</text>
<rect x="520" y="396" width="382" height="42" rx="5" fill="#fff" stroke="#737b84"/>
<text x="534" y="423" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#303740">Copy report link</text>
<text x="520" y="475" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#303740">UPDATE HISTORY</text>
<path d="M532,505 L532,705" fill="none" stroke="#737b84" stroke-width="2"/>
<circle cx="532" cy="511" r="6" fill="#303740"/>
<text x="550" y="515" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#303740">Just now · Resident</text>
<text x="550" y="540" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#303740">Report submitted with photo and location.</text>
<circle cx="532" cy="593" r="6" fill="#fff" stroke="#737b84"/>
<text x="550" y="597" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#303740">Next · Assembly review</text>
<text x="550" y="622" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#303740">Acknowledgement appears when recorded.</text>
<circle cx="532" cy="674" r="6" fill="#fff" stroke="#737b84"/>
<text x="550" y="678" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#303740">Later · Updates and resolution</text>
<text x="550" y="703" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#303740">Responses appear with author and date.</text>
<text x="520" y="751" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#303740">The issue changed or was not fixed?</text>
<rect x="520" y="769" width="382" height="42" rx="5" fill="#fff" stroke="#737b84"/>
<text x="534" y="796" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#303740">Add observation / request another look</text>
<text x="520" y="845" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#303740">Support and impact remain separate from</text>
<text x="520" y="867" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#303740">the assembly’s reviewed priority.</text>
<rect x="520" y="902" width="382" height="42" rx="5" fill="#fff" stroke="#737b84"/>
<text x="534" y="929" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#303740">Follow updates</text>
<text x="36" y="1010" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#303740">Submission error: keep the draft, explain the failure, and offer Retry. Show “saved” only after success.</text>
<path d="M36,1065 L924,1065" fill="none" stroke="#c6cbd0" stroke-width="1"/>
<text x="36" y="1095" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#303740">No fictional response deadlines. Future assembly updates are shown as pending steps, not completed actions.</text>
</svg>